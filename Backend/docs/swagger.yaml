basePath: /
definitions:
  models.AuditLog:
    properties:
      action:
        type: string
      audit_log_id:
        type: string
      created_at:
        type: string
      details:
        type: string
      id:
        type: integer
      resource:
        type: string
      resource_id:
        type: string
      user_id:
        type: string
    required:
    - action
    - details
    - resource
    - resource_id
    - user_id
    type: object
  models.Booking:
    properties:
      booking_id:
        type: string
      id:
        type: integer
      seat_numbers:
        items:
          type: string
        minItems: 1
        type: array
      showtime_id:
        type: string
      status:
        enum:
        - pending
        - confirmed
        - cancelled
        type: string
      total_price:
        type: number
      user_id:
        type: string
    required:
    - seat_numbers
    - showtime_id
    - status
    - total_price
    - user_id
    type: object
  models.Movie:
    properties:
      created_at:
        type: string
      description:
        type: string
      duration:
        minimum: 1
        type: integer
      genre:
        items:
          type: string
        type: array
      id:
        type: integer
      language:
        type: string
      movie_id:
        type: string
      poster_url:
        type: string
      rating:
        type: string
      release_date:
        type: string
      status:
        enum:
        - NOW_SHOWING
        - COMING_SOON
        - ENDED
        type: string
      subtitle:
        type: string
      title:
        type: string
      trailer_url:
        type: string
      updated_at:
        type: string
    required:
    - duration
    - genre
    - language
    - rating
    - release_date
    - status
    - title
    type: object
  models.Payment:
    properties:
      amount:
        type: number
      booking_id:
        type: string
      created_at:
        type: string
      id:
        type: integer
      method:
        enum:
        - cash
        - credit_card
        - promptpay
        - transfer
        type: string
      payment_id:
        type: string
      status:
        enum:
        - pending
        - paid
        - failed
        - refunded
        type: string
      transaction_ref:
        maxLength: 20
        minLength: 6
        type: string
      updated_at:
        type: string
    required:
    - amount
    - booking_id
    - method
    - status
    type: object
  models.Screen:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      screen_id:
        type: string
      theater_id:
        type: string
      total_seats:
        minimum: 1
        type: integer
      updated_at:
        type: string
    required:
    - name
    - theater_id
    - total_seats
    type: object
  models.Seat:
    properties:
      created_at:
        type: string
      id:
        type: integer
      screen_id:
        type: string
      seat_id:
        type: string
      seat_number:
        type: string
      seat_type:
        enum:
        - standard
        - premium
        - vip
        type: string
      updated_at:
        type: string
    required:
    - screen_id
    - seat_number
    - seat_type
    type: object
  models.Showtime:
    properties:
      created_at:
        type: string
      end_time:
        type: string
      id:
        type: integer
      movie_id:
        type: string
      price:
        type: number
      screen_id:
        type: string
      show_date:
        type: string
      showtime_id:
        type: string
      start_time:
        type: string
      status:
        enum:
        - scheduled
        - showing
        - finished
        - cancelled
        type: string
      theater_id:
        type: string
      updated_at:
        type: string
    required:
    - end_time
    - movie_id
    - price
    - show_date
    - start_time
    - status
    - theater_id
    type: object
  models.Theater:
    properties:
      address:
        type: string
      capacity:
        minimum: 1
        type: integer
      created_at:
        type: string
      id:
        type: integer
      location:
        type: string
      name:
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
      theater_id:
        type: string
      updated_at:
        type: string
    required:
    - address
    - capacity
    - location
    - name
    - status
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      google_id:
        type: string
      id:
        type: integer
      name:
        type: string
      profile_image:
        type: string
      role:
        enum:
        - user
        - admin
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - email
    - name
    - role
    type: object
